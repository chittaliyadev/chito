<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎉</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
}

.card{
    background:#fff;
    padding:40px 30px;
    border-radius:20px;
    text-align:center;
    width:350px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    color:#ff4081;
    font-size:36px;
    margin-bottom:15px;
}

h2{
    color:#333;
    margin-bottom:20px;
}

p{
    color:#666;
    line-height:1.6;
    margin-bottom:20px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#ff4081;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#e91e63;
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="card">
    <h1>🎂 Happy Birthday 🎉</h1>
    <h2>Dear Friend!</h2>

    <p>
        Wishing you a day filled with happiness, laughter,
        and unforgettable memories. May all your dreams
        come true and your year ahead be full of success,
        good health, and endless joy.
    </p>

    <button onclick="alert('🎉 Happy Birthday! Have a wonderful day! 🎂❤️')">
        Celebrate 🎁
    </button>
</div>

</body>
</html>
